name: Stock check

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 13:00-21:55 UTC. Covers US regular hours in both
    # EDT (13:30-20:00 UTC) and EST (14:30-21:00 UTC). The script never alerts
    # on a stale quote, so extra runs outside the session are harmless.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
  push:
    # Redeploy right away when you edit the watchlist or the dashboard.
    # (Commits made by this workflow with GITHUB_TOKEN never re-trigger it.)
    branches: [main]
    paths:
      - stocks.json
      - docs/**
      - scripts/**
      - .github/workflows/stock-check.yml

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rolling intraday history + last snapshot live in the Actions cache,
      # not in git, so the repo doesn't get a commit every 5 minutes.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            docs/data/history.json
            docs/data/latest.json
          key: stock-data-${{ github.run_id }}
          restore-keys: stock-data-

      - name: Fetch prices, market overview & screeners
        id: check
        run: python scripts/check_stocks.py

      - name: Save data cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            docs/data/history.json
            docs/data/latest.json
          key: stock-data-${{ github.run_id }}

      - name: Open or update alert issues
        if: steps.check.outputs.notify_count != '0' && steps.check.outputs.notify_count != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { alerts } = JSON.parse(fs.readFileSync('docs/data/alerts.json', 'utf8'));
            const LABEL = 'stock-alert';
            const { owner, repo } = context.repo;
            const pagesUrl = `https://${owner}.github.io/${repo}/`;

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'd93f0b',
                description: 'Automatic stock move alert',
              });
            } catch (e) {
              if (e.status !== 422) core.warning(`createLabel: ${e.message}`); // 422 = exists
            }

            const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const since = new Date(Date.now() - 3 * 24 * 3600 * 1000).toISOString();
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: LABEL, state: 'all', since, per_page: 100,
            });

            for (const a of alerts.filter((x) => x.notify)) {
              const sign = a.change_pct >= 0 ? '+' : '';
              const pct = `${sign}${a.change_pct.toFixed(2)}%`;
              const body = [
                `**${a.name} (${a.ticker})** is ${pct} vs. previous close.`,
                '',
                `| Price | Previous close | Move | Threshold |`,
                `|---|---|---|---|`,
                `| ${a.price.toFixed(2)} ${a.currency} | ${a.previous_close.toFixed(2)} | ${pct} | ±${a.threshold}% |`,
                '',
                `Quote time: ${a.market_time_iso} · ${a.reason}`,
                `Dashboard: ${pagesUrl}`,
              ].join('\n');

              const re = new RegExp(`^${esc(a.ticker)} moved [+-]?[\\d.]+% on ${esc(a.date)}$`);
              const issue = existing.find((i) => !i.pull_request && re.test(i.title));
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
                if (issue.state === 'closed') {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open' });
                }
                core.info(`Commented on #${issue.number} (${a.ticker} ${pct})`);
              } else {
                const { data } = await github.rest.issues.create({
                  owner, repo, title: a.title, body, labels: [LABEL],
                });
                existing.push(data);
                core.info(`Opened #${data.number}: ${a.title}`);
              }
            }

      # Only the small anti-spam state is committed, and only when it changes
      # (i.e. right after an alert), so alerts aren't repeated across runs.
      - name: Commit alert state
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/alert_state.json
          if git diff --cached --quiet; then
            echo "Alert state unchanged."
            exit 0
          fi
          git commit -m "Update alert state $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push alert state after 3 attempts"
          exit 1

      - name: Upload Pages artifact
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Separate job so a Pages problem can never block alerts.
  deploy:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
